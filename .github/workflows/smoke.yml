name: API

# Smoke + negative. API-only. No Telr card and no OMS tokens.
# Default server is test (testdeploy).
on:
  push:
    paths-ignore:
      - "docs/**"
      - "explorer/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "explorer/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      env:
        description: Target server. test = testdeploy channel. staging = sprint205.
        type: choice
        options:
          - test
          - staging
        default: test

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, negative]
    env:
      ENV: ${{ github.event.inputs.env || 'test' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run ${{ matrix.suite }} suite
        run: mvn -B test -P${{ matrix.suite }} -Denv=${{ env.ENV }}
      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extent-${{ matrix.suite }}-report-${{ env.ENV }}
          path: reports/
          if-no-files-found: ignore
