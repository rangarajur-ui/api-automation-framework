name: E2E

# Nightly plus manual run. Needs Chrome. Card values come from GitHub secrets,
# not from the repo. If secrets are missing, QrOrderFlowTest still passes
# after initiate_payment and skips Telr.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - name: Run Telr E2E suite
        env:
          TELR_CARD_NUMBER: ${{ secrets.TELR_CARD_NUMBER }}
          TELR_CVV: ${{ secrets.TELR_CVV }}
          TELR_EXP_MONTH: ${{ secrets.TELR_EXP_MONTH }}
          TELR_EXP_YEAR: ${{ secrets.TELR_EXP_YEAR }}
          TELR_HEADLESS: "true"
        run: mvn -B test -Pe2e
      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-e2e-report
          path: reports/extent-report.html
          if-no-files-found: ignore
