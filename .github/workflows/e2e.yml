name: E2E

# Nightly plus manual run. Needs Chrome. Card values come from GitHub secrets,
# not from the repo. Missing secrets fail the checkout tests.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Telr E2E suite
        env:
          TELR_CARD_NUMBER: ${{ secrets.TELR_CARD_NUMBER }}
          TELR_CVV: ${{ secrets.TELR_CVV }}
          TELR_EXP_MONTH: ${{ secrets.TELR_EXP_MONTH }}
          TELR_EXP_YEAR: ${{ secrets.TELR_EXP_YEAR }}
          TELR_HEADLESS: "true"
        run: mvn -B test -Pe2e
      - name: Upload Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-e2e-report
          path: reports/
          if-no-files-found: ignore
